
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "DataPilot"
version = "0.0.1"
description = "Data Analyst Assistant"
requires-python = ">=3.10"



dependencies = [
    "fastapi[standard]>=0.100.0",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "google-genai==2.18.1",
    "google-auth==2.56.3",
    "requests==2.34.2",
    "cryptography==50.0.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.52",
    "boto3==1.43.92",
    "psycopg[binary]==3.3.5",
    "psycopg2-binary==2.9.12"
]



[tool.fastapi]
entrypoint = "app.app:app"


[tool.uvicorn]
host = "0.0.0.0"
port = 8000


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["uploads*"]